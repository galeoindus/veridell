# Checks and tests on every push and pull request.
#
# The audit's F-11 was that nothing verified the code. `npm run verify` parses
# every module, checks that every import resolves, and runs the unit tests —
# including the three that pin the routing bug the audit found.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      # The tests import jsdom, and the job never installed it — so `verify`
      # died with ERR_MODULE_NOT_FOUND before a single assertion ran. The
      # dependency step was simply missing.
      - name: Install dependencies
        run: npm ci
      - name: Stamp every page and verify the repository
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run stamp:build && npm run verify

      # `verify` answers "does it still work". `doctor` adds the two checks a
      # push does not otherwise run: the deep file-by-file audit and the drift
      # audit (a page nothing links to, an article outside the sitemap). Both
      # are cheap, so they run on every push rather than only on Mondays.
      - name: Deep and drift checks
        run: npm run doctor

  # P4-08 — browser evidence as a gate, not a local courtesy.
  # The unit suite proves the code parses and the contracts hold; it cannot see
  # that the composer is hidden behind the keyboard or that a phone scrolls
  # sideways. This job loads the real page at the report's six device sizes and
  # fails on the faults that only appear when it renders.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Point the check at the installed browser
        run: |
          BIN=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          echo "using $BIN"
      - name: Stamp the build
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run stamp:build
      - name: Chat layout at six device sizes
        run: npm run check:layout
